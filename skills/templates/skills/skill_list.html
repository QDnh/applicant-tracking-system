{% extends "base.html" %}

{% block title %}Skills{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-bold">Skills</h1>
  <a href="{% url 'skills:create' %}" class="btn btn-primary btn-sm">Add skill</a>
</div>
<div class="card bg-base-100 shadow">
  <div class="card-body">
    {% if skills %}
    <table class="table">
      <thead>
        <tr><th>Name</th><th class="text-right">Actions</th></tr>
      </thead>
      <tbody>
        {% for skill in skills %}
        <tr>
          <td>{{ skill.name }}</td>
          <td class="text-right space-x-1">
            <a href="{% url 'skills:update' skill.pk %}" class="btn btn-xs btn-ghost">Rename</a>
            <a href="{% url 'skills:delete' skill.pk %}" class="btn btn-xs btn-ghost text-error">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="opacity-70">No skills yet.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
